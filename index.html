<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Tobi Simon — AfroGospel artist</title>
<meta name="description" content="Tobi Simon — AfroGospel artist, singer and minister of the Gospel. Stream the music, watch live ministrations and book Tobi for your event.">
<meta name="theme-color" content="#0B0A09">
<meta property="og:title" content="Tobi Simon — AfroGospel artist">
<meta property="og:description" content="Stream the music, watch live ministrations and book Tobi for your event.">
<meta property="og:type" content="profile">
<meta property="og:image" content="assets/img/hero.jpg">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css?v=20261011">
<link rel="stylesheet" href="assets/site.css?v=20261011">
<script type="application/ld+json">
{ "@context":"https://schema.org", "@type":"MusicGroup", "name":"Tobi Simon",
  "genre":"AfroGospel", "description":"AfroGospel artist, singer and minister of the Gospel.",
  "sameAs":["https://audiomack.com/tobiis_simon","https://open.spotify.com/artist/5ok8MLJr3qnLKP6DsH08le",
            "https://music.apple.com/gb/artist/tobi-simon/1721548707","https://www.youtube.com/@Tobiis_Simon"] }
</script>
</head>
<body data-page="home">

<main id="main">

  <section class="hero shell">
    <div class="hero__brand">
      <span class="hero__mark"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="currentColor"/>
        <path d="M9 14v4M12.5 11v10M16 7.5v17M19.5 11v10M23 14v4" stroke="#0B0A09" stroke-width="2.1" stroke-linecap="round"/></svg></span>
      <h1>TOBI SIMON</h1>
    </div>
    <p class="hero__tag" id="tagline"></p>
    <div id="nowWrap"></div>

    <div id="homeFlow"></div>
    <div class="cfcap" id="homeCap" aria-live="polite"></div>
  </section>

  <section class="shell bento" aria-label="Highlights">
    <article class="tile tile--video glass" id="tVideo"></article>
    <article class="tile glass" id="tShow"></article>
    <article class="tile tile--num glass" id="tNum"></article>
    <article class="tile tile--about glass" id="tAbout"></article>
  </section>

</main>

<script type="module">
import { onData, $, esc, PLAY, playTrack, openVideo, ambientFrom, releaseCard, plural,
         ytId, ytThumb, fmtDate, compact } from './assets/site.js?v=20261011';
import { coverflow } from './assets/coverflow.js?v=20261011';
import { releasesNewestFirst, splitShows } from './assets/shared-data.js?v=20261011';

let REL = [], VIDEO = null, flow = null, first = true;

function caption(i){
  const { a, i: ai } = REL[i];
  const n = (a.tracks || []).length;
  const cap = $('#homeCap');
  cap.dataset.swap = 'false'; void cap.offsetWidth; cap.dataset.swap = 'true';
  cap.innerHTML = `
    <h2>${esc(a.title)}</h2>
    <p>${esc(a.kind || 'Album')}${a.year ? ', ' + esc(a.year) : ''}${n ? ' — ' + plural(n, 'track') : ''}</p>
    <div class="release__actions" style="justify-content:center">
      ${n ? `<button class="btn btn--gold press" data-play-ai="${ai}">${PLAY} Play</button>` : ''}
      <a class="btn btn--glass glass press" href="music.html?r=${ai}">+ More</a>
    </div>`;
}

onData(DATA => {
  const p = DATA.profile || {};
  $('#tagline').textContent = p.tagline || '';
  REL = releasesNewestFirst(DATA.albums);

  /* latest release, one tap to play */
  const latest = REL[0];
  $('#nowWrap').innerHTML = latest ? `
    <div class="hero__now glass">
      ${latest.a.art ? `<img src="${esc(latest.a.art)}" alt="" onerror="this.remove()">` : ''}
      <div class="hero__now-t"><small>${latest.a.kind === 'Album' ? 'Latest album' : 'Latest single'}</small>
        <strong>${esc(latest.a.title)}</strong></div>
      ${(latest.a.tracks || []).length ? `<button class="btn btn--gold btn--sm press" data-play-ai="${latest.i}">${PLAY} Play</button>` : ''}
    </div>` : '';

  /* the coverflow — keeps its place when content refreshes live */
  const keep = flow ? Math.min(flow.index, REL.length - 1) : 0;
  flow = coverflow($('#homeFlow'), {
    items: REL, label: 'Releases', start: keep, intro: first, autoplay: 6500,
    render: ({ a }) => releaseCard(a),
    onChange: i => { caption(i); ambientFrom(REL[i].a.art); },
    onActivate: i => { location.href = 'music.html?r=' + REL[i].i; }
  });
  first = false;

  /* featured video */
  VIDEO = (DATA.videos || []).find(v => ytId(v.url)) || null;
  const KIND = { music:'Music video', live:'Live', interview:'Interview' };
  $('#tVideo').style.display = VIDEO ? '' : 'none';
  if (VIDEO){
    const id = ytId(VIDEO.url);
    $('#tVideo').innerHTML = `
      <button class="vthumb" data-video aria-label="Play ${esc(VIDEO.title)}">
        <img src="${ytThumb(id, 'maxresdefault')}" alt="" loading="lazy"
             onerror="this.onerror=null;this.src='${ytThumb(id)}'">
        <span class="card__play glass">${PLAY}</span>
      </button>
      <div class="tile__body">
        <div class="tile__k">${esc(KIND[VIDEO.kind] || 'Video')}</div>
        <h3>${esc(VIDEO.title)}</h3>
        <p><a class="btn btn--quiet" href="videos.html" style="padding-left:0">All videos</a></p>
      </div>`;
  }

  /* next show, or the booking invitation */
  const next = splitShows(DATA.shows).upcoming[0];
  $('#tShow').innerHTML = next ? `
    <div class="tile__k">Next show</div>
    <h3>${esc(next.venue)}</h3>
    <p>${esc(fmtDate(next.date))}${next.city ? ', ' + esc(next.city) : ''}</p>
    <div class="release__actions">
      ${next.ticketUrl ? `<a class="btn btn--gold btn--sm press" href="${esc(next.ticketUrl)}" target="_blank" rel="noopener">Tickets</a>` : ''}
      <a class="btn btn--glass btn--sm glass press" href="shows.html">All shows</a></div>` : `
    <div class="tile__k">Live</div>
    <h3>Bring Tobi to your stage</h3>
    <p>Booking churches, concerts and conferences now.</p>
    <div class="release__actions"><a class="btn btn--gold btn--sm press" href="contact.html" data-track="talk_click">Book Tobi</a></div>`;

  /* audience, summed across the platforms that report numbers */
  const counted = (DATA.platforms || []).filter(x => x.value > 0);
  const total = counted.reduce((s, x) => s + Number(x.value || 0), 0);
  const names = counted.map(x => x.name);
  const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names.at(-1) : names[0] || '';
  $('#tNum').style.display = total ? '' : 'none';
  $('#tNum').innerHTML = `
    <div class="tile__k">Audience</div>
    <div class="num">${compact(total).replace(/([KMB])$/, '<em>$1</em>')}</div>
    <p>plays and streams across ${esc(list)}.</p>
    <p><a class="btn btn--quiet" href="music.html#numbers" style="padding-left:0">See the numbers</a></p>`;

  const firstLine = String((p.bio || [])[0] || '').split(/(?<=\.)\s/)[0];
  $('#tAbout').innerHTML = `
    ${p.heroImage ? `<img src="${esc(p.heroImage)}" alt="Tobi Simon" loading="lazy">` : ''}
    <div><h3>${esc(p.name || 'Tobi Simon')}</h3><p>${esc(firstLine)}</p></div>
    <a class="btn btn--glass glass press" href="about.html">About Tobi</a>`;
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-play-ai]');
  if (b){ playTrack(Number(b.dataset.playAi), 0); return; }
  const card = e.target.closest('#homeFlow [data-play]');
  if (card){ playTrack(REL[Number(card.closest('.cf__item').dataset.i)].i, 0); return; }
  if (e.target.closest('[data-video]') && VIDEO) openVideo(VIDEO);
});
</script>
</body>
</html>
